repos:
  - repo: local
    hooks:
      - id: format
        name: ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
      - id: lint
        name: ruff lint
        entry: uv run ruff check . --fix
        language: system
        pass_filenames: false
      - id: test
        name: unit test
        entry: uv run pytest
        language: system
        pass_filenames: false
