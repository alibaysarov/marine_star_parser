[project]
name = "marine-parser"
version = "0.1.0"
description = "Parser for invoices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "argostranslate>=1.11.0",
    "googletrans>=4.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.10",
    "pyinstaller>=6.22.2",
    "pyside6>=6.11.2",
    "python-calamine>=0.8.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["repository", "service", "helpers", "workers", "excel_parser"]

[tool.coverage.report]
show_missing = true
fail_under = 75
